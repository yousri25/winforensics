# Windows VM for winforensics (image: https://github.com/dockur/windows).
# Values come from ~/.config/winforensics/config.env (passed with --env-file).
name: winforensics

volumes:
  data:

services:
  windows:
    image: ghcr.io/dockur/windows:latest
    container_name: WinForensics
    environment:
      VERSION: ${WF_VERSION:-11}
      RAM_SIZE: ${WF_RAM:-8G}
      CPU_CORES: ${WF_CPUS:-4}
      DISK_SIZE: ${WF_DISK:-64G}
      USERNAME: ${WF_USERNAME:?WF_USERNAME is required}
      PASSWORD: ${WF_PASSWORD:?WF_PASSWORD is required}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/kvm
      - /dev/net/tun
    ports:
      # Localhost only: nothing on your network can reach the VM.
      - 127.0.0.1:8006:8006        # web console (setup and troubleshooting only)
      - 127.0.0.1:3389:3389/tcp    # RDP
      - 127.0.0.1:3389:3389/udp
    stop_grace_period: 120s        # give Windows time to shut down cleanly
    restart: "no"
    volumes:
      - data:/storage                                       # the Windows C: drive
      - ${WF_SHARE:-${HOME}/WinForensics-Share}:/shared     # shows up as \\host.lan\Data
